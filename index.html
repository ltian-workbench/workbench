<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财税工作台</title>
<style>
  :root {
    --bg: #f1f5f9;
    --sidebar-bg: #1a2035;
    --sidebar-width: 264px;
    --header-height: 68px;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-hover: 0 10px 25px -5px rgba(15,23,42,0.1), 0 8px 10px -6px rgba(15,23,42,0.04);
    --shadow-card: 0 2px 8px rgba(15,23,42,0.06);
    --primary: #2563eb;
    --primary-light: #60a5fa;
    --primary-dark: #1d4ed8;
    --primary-bg: #eff6ff;
    --text: #0f172a;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-width);
    background: #1a2035;
    border-right: 1px solid #2a324e;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 10;
    color: #cbd5e1;
  }
  .brand {
    padding: 24px 20px 20px;
    border-bottom: 1px solid #2a324e;
  }
  .brand-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .brand-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
    box-shadow: 0 4px 6px -1px rgba(37,99,235,0.3);
  }
  .brand-title {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
    color: #fff;
  }
  .brand-sub {
    font-size: 12px; color: #94a3b8; padding-left: 52px;
    letter-spacing: 0.5px;
  }
  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    margin-bottom: 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.18s ease;
    border-left: 3.5px solid transparent;
    font-size: 14px;
    color: #94a3b8;
  }
  .nav-item:hover {
    background: #25304a;
    color: #e2e8f0;
  }
  .nav-item.active {
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    border-left-color: #60a5fa;
  }
  .nav-icon { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; }
  .nav-text { flex: 1; line-height: 1.3; }
  .nav-badge {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #334155;
    color: #94a3b8;
  }
  .nav-item.active .nav-badge { background: rgba(255,255,255,0.2); color: #fff; }
  .sidebar-foot {
    padding: 14px 18px;
    border-top: 1px solid #2a324e;
    font-size: 11px;
    color: #64748b;
    text-align: center;
    line-height: 1.5;
  }

  /* ===== 主区域 ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .header {
    height: var(--header-height);
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    flex-shrink: 0;
  }
  .header-left {
    display: flex; align-items: center; gap: 14px;
  }
  .header-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .header-count {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    background: var(--primary-bg); padding: 4px 10px; border-radius: 999px;
  }
  .header-date {
    font-size: 13px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 6px;
  }
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 260px;
    padding: 9px 14px 9px 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    background: #fff;
  }
  .search-box input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(139,123,181,0.12);
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; opacity: 0.5;
  }
  .header-actions { display: flex; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    color: #5d5370;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #f8f6fa; border-color: #d5cfe0; }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none;
    box-shadow: 0 4px 6px -1px rgba(109,94,156,0.25);
  }
  .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-success {
    background: linear-gradient(135deg, #7bc17e, #5cb85c);
    color: #fff; border: none;
    box-shadow: 0 4px 6px -1px rgba(92,184,92,0.25);
  }
  .btn-success:hover { opacity: 0.92; transform: translateY(-1px); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 40px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-label {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* ===== 主页 ===== */
  .home-view {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 欢迎横幅 */
  .welcome-banner {
    background: linear-gradient(135deg, #3b82f6, #2563eb, #1d4ed8);
    border-radius: var(--radius);
    padding: 28px 32px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(37,99,235,0.25);
  }
  .welcome-banner::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .welcome-banner::after {
    content: '';
    position: absolute;
    bottom: -60px; right: 80px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  .welcome-title {
    font-size: 22px; font-weight: 700;
    margin-bottom: 6px;
    position: relative; z-index: 1;
  }
  .welcome-sub {
    font-size: 14px; opacity: 0.9;
    position: relative; z-index: 1;
  }
  .network-info {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13px;
    color: #0369a1;
    margin-top: 12px;
  }
  .network-info span {
    font-weight: 600;
    font-family: monospace;
    background: #e0f2fe;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 4px;
  }

  /* 主页网格 */
  .home-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 1100px) {
    .home-grid {
      grid-template-columns: 1.1fr 0.9fr;
    }
  }

  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow-card);
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .panel-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-sub {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 日历 */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendar-month {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .calendar-nav {
    display: flex;
    gap: 6px;
  }
  .calendar-nav button {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .calendar-nav button:hover {
    background: var(--primary-bg);
    border-color: var(--primary-light);
    color: var(--primary-dark);
  }
  .calendar-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 4px;
  }
  .calendar-table th {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 8px 4px;
    text-align: center;
  }
  .calendar-table td {
    text-align: center;
    padding: 8px 4px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    height: 44px;
    vertical-align: middle;
  }
  .calendar-table td:hover:not(.empty-day):not(.today) {
    background: #f5f3f8;
  }
  .calendar-table td.today {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 10px rgba(139,123,181,0.3);
    font-weight: 700;
  }
  .calendar-table td.other-month {
    color: #c4bdd0;
  }
  .calendar-table td.empty-day {
    cursor: default;
  }
  .calendar-dot {
    width: 5px; height: 5px;
    background: var(--primary-light);
    border-radius: 50%;
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
  }
  .calendar-table td.today .calendar-dot {
    background: rgba(255,255,255,0.7);
  }

  /* 待办事项 */
  .todo-section {
    margin-bottom: 16px;
  }
  .todo-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    padding-left: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .todo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #faf9fb;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: all 0.15s;
    cursor: pointer;
  }
  .todo-item:hover {
    border-color: var(--border);
    background: #f5f3f8;
  }
  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: #b0a8bf;
  }
  .todo-item.done .todo-checkbox {
    background: var(--success);
    border-color: var(--success);
  }
  .todo-checkbox {
    width: 18px; height: 18px;
    border: 2px solid #d5cfe0;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    cursor: pointer;
    font-size: 11px;
    color: #fff;
  }
  .todo-checkbox:hover {
    border-color: var(--primary-light);
  }
  .todo-text {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
  }
  .todo-delete {
    opacity: 0;
    color: #c4bdd0;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
    padding: 2px 4px;
  }
  .todo-item:hover .todo-delete {
    opacity: 1;
  }
  .todo-delete:hover {
    color: var(--danger);
  }
  .todo-empty {
    text-align: center;
    padding: 24px;
    color: #c4bdd0;
    font-size: 13px;
  }

  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .todo-input {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    background: #fff;
  }
  .todo-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(139,123,181,0.1);
  }

  .todo-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .done-section {
    margin-top: 8px;
  }
  .done-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px 4px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    user-select: none;
  }
  .done-header:hover {
    background: rgba(139,123,181,0.08);
  }
  .done-body {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding-top: 4px;
  }
  .done-body.open {
    display: flex;
  }

  .quick-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .quick-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #faf9fb;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-item:hover {
    border-color: var(--border);
    background: #f5f3f8;
  }
  .quick-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .quick-info {
    flex: 1;
    min-width: 0;
  }
  .quick-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .quick-desc {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* 固定事项设置弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45,36,69,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    width: 95%;
    max-width: 720px;
    max-height: 98vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(45,36,69,0.25);
    transform: translateY(16px) scale(0.97);
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  .modal-overlay.show .modal {
    transform: translateY(0) scale(1);
  }
  .modal-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .modal-close {
    width: 32px; height: 32px;
    border: none; background: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-close:hover {
    background: #f5f3f8;
    color: var(--text);
  }
  .modal-body {
    padding: 14px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 10px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  .fixed-todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .fixed-todo-item input[type="text"] {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .fixed-todo-item input[type="text"]:focus {
    border-color: var(--primary-light);
  }
  .fixed-todo-item input[type="number"] {
    width: 64px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .fixed-todo-item input[type="number"]:focus {
    border-color: var(--primary-light);
  }
  .fixed-todo-item .day-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .fixed-todo-remove {
    color: #c4bdd0;
    cursor: pointer;
    font-size: 18px;
    padding: 2px;
    transition: color 0.15s;
  }
  .fixed-todo-remove:hover {
    color: var(--danger);
  }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: var(--shadow);
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--card-color, var(--primary));
    opacity: 0.85;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: #d5cfe0;
  }
  .card:active { transform: translateY(0); }
  .card-header {
    display: flex; align-items: flex-start; gap: 14px;
  }
  .card-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--card-bg, var(--primary-bg));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-size: 15px; font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    word-break: break-all;
  }
  .card-tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--card-bg, var(--primary-bg));
    color: var(--card-color, var(--primary));
  }
  .card-desc {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
    word-break: break-all;
  }
  .card-action {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px;
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
    background: var(--card-bg, var(--primary-bg));
    color: var(--card-color, var(--primary));
    transition: all 0.2s;
  }
  .card:hover .card-action {
    filter: brightness(0.96);
  }

  /* ===== 空状态 ===== */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
  }
  .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
  .empty-text { font-size: 15px; font-weight: 500; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: #2d2445;
    color: #fff;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 12px 28px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(12px) scale(0.96);
    transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    pointer-events: none;
    z-index: 9999;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .toast-icon { font-size: 18px; }

  /* ===== 滚动条 ===== */

  /* ========== 日历 ========== */
  function renderCalendar() {
    const y = calendarDate.getFullYear();
    const m = calendarDate.getMonth();
    const today = new Date();

    $('calendarYear').textContent = `${y}年`;
    $('calendarMonth').textContent = `${m + 1}月`;
    $('todoMonth').textContent = `${y}年${m + 1}月`;

    // 欢迎语
    const hour = today.getHours();
    let greeting = '欢迎来到你的工作台';
    if (hour < 12) greeting = '早上好，开启元气满满的一天';
    else if (hour < 14) greeting = '中午好，记得休息一下';
    else if (hour < 19) greeting = '下午好，保持专注';
    else greeting = '晚上好，今天辛苦了';
    $('welcomeTitle').textContent = greeting;

    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m + 1, 0);
    const daysInMonth = lastDay.getDate();
    let startWeekday = firstDay.getDay(); // 0=Sun
    if (startWeekday === 0) startWeekday = 7;

    // 上月天数
    const prevLastDay = new Date(y, m, 0).getDate();

    let html = '<tr>';
    let cellCount = 0;

    // 上月补全
    for (let i = startWeekday - 1; i > 0; i--) {
      const d = prevLastDay - i + 1;
      html += `<td class="other-month">${d}</td>`;
      cellCount++;
    }

    // 当月
    const todoData = getTodoData();
    const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
    const hasFixed = todoData.fixed && todoData.fixed.length > 0;
    const hasMonthly = todoData.monthly[monthKey] && todoData.monthly[monthKey].length > 0;

    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
      const cls = isToday ? 'today' : '';

      // 检查当天是否有固定事项（按日期匹配）
      let hasTodo = false;
      if (hasFixed) {
        hasTodo = todoData.fixed.some(f => f.day == d);
      }
      if (!hasTodo && hasMonthly) {
        // 简单标记：当月任意日期只要有待办就标记（更精确可以按具体日期存）
        hasTodo = true;
      }

      const dot = hasTodo ? '<div class="calendar-dot"></div>' : '';
      html += `<td class="${cls}" onclick="selectCalendarDay(${d})">${d}${dot}</td>`;
      cellCount++;

      if (cellCount % 7 === 0 && d < daysInMonth) {
        html += '</tr><tr>';
      }
    }

    // 下月补全
    const remaining = (7 - (cellCount % 7)) % 7;
    for (let d = 1; d <= remaining; d++) {
      html += `<td class="other-month">${d}</td>`;
    }

    html += '</tr>';
    $('calendarBody').innerHTML = html;
  }

  function renderChecklistTable(type, tableId) {

  window.updateChecklistHeader = function(type, idx, value) {
    var oldName = checklistData[type].headers[idx];

    if (oldName === newName || newName === '') return;
    checklistData[type].headers[idx] = newName;
    // 同步更新所有行中的键名
    checklistData[type].rows.forEach(function(row) {

      });

      if (fixedUndone.length === 0) {
        fixedList.innerHTML = '<div class="todo-empty">本月固定事项已全部完成 🎉</div>';
      } else {
        fixedUndone.sort(function(a, b) { return (a.f.day || 0) - (b.f.day || 0); });
        fixedList.innerHTML = fixedUndone.map(function(_ref) {

    }
  };

  window.toggleFixedTodo = function(idx) {
    const data = getTodoData();
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    if (!data.fixed[idx]) return;

    if (!data.fixed[idx].doneMonths) data.fixed[idx].doneMonths = [];
    const pos = data.fixed[idx].doneMonths.indexOf(monthKey);
    if (pos >= 0) {
      data.fixed[idx].doneMonths.splice(pos, 1);
    } else {
      data.fixed[idx].doneMonths.push(monthKey);
    }
    saveTodoData(data);
    renderTodos();
    renderCalendar();
  };

  window.toggleMonthlyTodo = function(idx) {
    const data = getTodoData();
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    if (!data.monthly[monthKey] || !data.monthly[monthKey][idx]) return;

    data.monthly[monthKey][idx].done = !data.monthly[monthKey][idx].done;
    saveTodoData(data);
    renderTodos();
  };

  window.deleteMonthlyTodo = function(idx, event) {
    event.stopPropagation();
    const data = getTodoData();
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    if (data.monthly[monthKey]) {
      data.monthly[monthKey].splice(idx, 1);
      if (data.monthly[monthKey].length === 0) delete data.monthly[monthKey];
      saveTodoData(data);
      renderTodos();
      showToast('已删除', '🗑️');
    }
  };

  window.addTodo = function() {
    const input = $('newTodoInput');
    const text = input.value.trim();
    if (!text) return;

    const data = getTodoData();
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    if (!data.monthly[monthKey]) data.monthly[monthKey] = [];
    data.monthly[monthKey].push({ text, done: false, created: Date.now() });
    saveTodoData(data);
    input.value = '';
    renderTodos();
    renderCalendar();
    showToast('已添加待办事项', '✅');
  };

  window.clearDoneTodos = function() {
    const data = getTodoData();
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    let resetCount = 0;

    // 重置固定事项
    if (data.fixed) {
      data.fixed.forEach(f => {
        if (f.doneMonths && f.doneMonths.includes(monthKey)) {
          const pos = f.doneMonths.indexOf(monthKey);
          if (pos >= 0) { f.doneMonths.splice(pos, 1); resetCount++; }
        }
      });
    }

    // 重置当月新增事项
    if (data.monthly[monthKey]) {
      data.monthly[monthKey].forEach(t => {
        if (t.done) { t.done = false; resetCount++; }
      });
    }

    if (resetCount > 0) {
      saveTodoData(data);
      renderTodos();
      renderCalendar();
      showToast(`已重置 ${resetCount} 项已完成事项`, '🔄');
    } else {
      showToast('没有已完成事项', 'ℹ️');
    }
  };

  /* ========== 固定事项设置弹窗 ========== */
  let fixedModalRows = [];

  window.openFixedTodoModal = function() {
    const data = getTodoData();
    fixedModalRows = data.fixed.map(f => ({ ...f }));
    // 默认至少提供 10 行空输入框，方便批量录入
    const MIN_ROWS = 10;
    while (fixedModalRows.length < MIN_ROWS) {
      fixedModalRows.push({ text: '', day: 1 });
    }
    renderFixedModalRows();
    $('fixedModal').classList.add('show');
  };

  window.closeFixedModal = function() {
    $('fixedModal').classList.remove('show');
  };

  function renderFixedModalRows() {
    const body = $('fixedModalBody');
    body.innerHTML = fixedModalRows.map((row, idx) => `
      <div class="fixed-todo-item">
        <input type="text" placeholder="事项内容" value="${escapeHtml(row.text)}" onchange="updateFixedRow(${idx}, 'text', this.value)">
        <span class="day-label">每月</span>
        <input type="number" min="1" max="31" value="${row.day}" onchange="updateFixedRow(${idx}, 'day', this.value)">
        <span class="day-label">日</span>
        <span class="fixed-todo-remove" onclick="removeFixedRow(${idx})">✕</span>
      </div>
    `).join('');
  }

  window.updateFixedRow = function(idx, field, value) {
    if (field === 'day') value = parseInt(value) || 1;
    fixedModalRows[idx][field] = value;
  };

  window.removeFixedRow = function(idx) {
    fixedModalRows.splice(idx, 1);
    renderFixedModalRows();
  };

  window.addFixedRow = function() {
    fixedModalRows.push({ text: '', day: 1 });
    renderFixedModalRows();
  };

  window.addFixedRows = function(n) {
    for (let i = 0; i < n; i++) {
      fixedModalRows.push({ text: '', day: 1 });
    }
    renderFixedModalRows();
  };

  window.saveFixedTodos = function() {
    const validRows = fixedModalRows
      .filter(r => r.text.trim())
      .map(r => ({
        text: r.text.trim(),
        day: Math.max(1, Math.min(31, parseInt(r.day) || 1)),
        doneMonths: r.doneMonths || []
      }));
    const data = getTodoData();
    data.fixed = validRows;
    saveTodoData(data);
    closeFixedModal();
    renderTodos();
    renderCalendar();
    showToast('固定事项已保存', '💾');
  };

  // 点击弹窗外部关闭
  $('fixedModal').addEventListener('click', function(e) {
    if (e.target === this) closeFixedModal();
  });

  /* ========== 工具视图 ========== */
  function normalizeFile(f) {
    if (typeof f === 'string') return { name: f, url: null, path: null };
    return { path: null, ...f };
  }

  function getFilteredFiles() {
    const cat = categories[currentIndex];
    if (!searchText.trim()) return cat.files.map(f => ({ ...normalizeFile(f), cat }));
    const kw = searchText.toLowerCase();
    const results = [];
    categories.forEach(c => {
      c.files.forEach(f => {
        const nf = normalizeFile(f);
        if (nf.name.toLowerCase().includes(kw)) {
          results.push({ ...nf, cat: c });
        }
      });
    });
    return results;
  }

  function renderGrid() {
    const items = getFilteredFiles();
    const cat = categories[currentIndex];
    $('catIcon').textContent = searchText ? '🔎' : cat.icon;
    $('catName').textContent = searchText ? `搜索：${searchText}` : cat.name;
    $('catCount').textContent = `${items.length} 个技能`;
    $('sectionLabel').textContent = searchText ? '搜索结果' : cat.name + ' — 技能陈列';

    const grid = $('grid');
    if (items.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">未找到匹配的技能</div>
      </div>`;
      return;
    }

    grid.innerHTML = items.map(item => {
      const c = item.cat;
      const isWeb = !!item.url;
      const isPath = !!item.path;
      var ext = '';
      if (item.path) {
        var lastDot = item.path.lastIndexOf('.');
        if (lastDot >= 0) ext = item.path.slice(lastDot + 1).toLowerCase();
      } else if (item.name) {
        var lastDot2 = item.name.lastIndexOf('.');
        if (lastDot2 >= 0) ext = item.name.slice(lastDot2 + 1).toLowerCase();
      }

      var tagText, actionText;
      if (isWeb) {
        tagText = '网页工具';
        actionText = '打开网页';
      } else if (ext === 'py') {
        tagText = 'Python 脚本';
        actionText = '运行脚本';
      } else if (ext === 'txt') {
        tagText = '文本文件';
        actionText = '打开文件';
      } else if (['xlsx', 'xls', 'xlsm'].indexOf(ext) >= 0) {
        tagText = 'Excel 工作簿';
        actionText = '运行工具';
      } else {
        tagText = '本地文件';
        actionText = '打开文件';
      }

      let clickAttr;
      if (isWeb) {
        clickAttr = `onclick="window.open('${escapeJs(item.url)}', '_blank')"`;
      } else if (isPath) {
        clickAttr = `onclick="openSkillByPath('${escapeJs(item.path)}')"`;
      } else {
        clickAttr = `onclick="openSkill('${escapeJs(item.name)}')"`;
      }
      return `<div class="card" style="--card-color:${c.color};--card-bg:${c.bg}" ${clickAttr}>
        <div class="card-header">
          <div class="card-icon">${c.icon}</div>
          <div class="card-body">
            <div class="card-name">${escapeHtml(item.name)}</div>
            ${item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : ''}
            <span class="card-tag">${tagText}</span>
          </div>
        </div>
        <div class="card-action">
          <span>▶</span> <span>${actionText}</span>
        </div>
      </div>`;
    }).join('');
  }

  window.openSkill = async function(filename) {
    try {
      const res = await fetch(API_BASE + '/api/open', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: filename })
      });
      if (res.ok) {
        showToast('正在启动：' + filename, '🚀');
      } else {
        const data = await res.json().catch(() => ({}));
        showToast('启动失败：' + (data.error || '未知错误'), '❌');
      }
    } catch (e) {
      showToast('无法连接到 localhost:8765，请确认已运行「启动工作台.bat」', '⚠️');
    }
  };

  window.openSkillByPath = async function(filepath) {
    try {
      const res = await fetch(API_BASE + '/api/open', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: filepath })
      });
      if (res.ok) {
        const fname = filepath.replace(/\\/g, '/').split('/').pop();
        showToast('正在启动：' + fname, '🚀');
      } else {
        const data = await res.json().catch(() => ({}));
        showToast('启动失败：' + (data.error || '未知错误'), '❌');
      }
    } catch (e) {
      showToast('无法连接到 localhost:8765，请确认已运行「启动工作台.bat」', '⚠️');
    }
  };

  window.openWorkDir = async function() {
    try {
      const res = await fetch(API_BASE + '/api/open-folder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      if (res.ok) {
        showToast('已打开工作目录', '📁');
      } else {
        showToast('打开目录失败', '❌');
      }
    } catch (e) {
      showToast('无法连接到本地服务', '⚠️');
    }
  };

  window.reloadPage = function() {
    searchText = '';
    $('searchInput').value = '';
    renderNav();
    switchView();
    showToast('已刷新', '🔄');
  };

  window.toggleMobileMenu = function() {
    $('sidebar').classList.toggle('open');
    $('sidebarOverlay').classList.toggle('show');
  };

  $('searchInput').addEventListener('input', (e) => {
    searchText = e.target.value;
    renderGrid();
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeJs(s) {
    return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
  }

  /* ========== 初始化 ========== */
  updateHeaderDate();
  renderNav();
  switchView();
  loadChecklist();

  // 页面刷新/关闭前强制保存 checklist，避免 debounce Pending 丢失
  window.addEventListener('beforeunload', function() {
    if (checklistSaveTimer) {
      clearTimeout(checklistSaveTimer);
      checklistSaveTimer = null;
    }
    // 同步写本地缓存
    checklistData.updatedAt = Date.now();
    localStorage.setItem(LS_CHECKLIST, JSON.stringify(checklistData));
    // 尝试同步发送到服务器（sendBeacon 比 fetch 在卸载时更可靠）
    if (typeof navigator !== 'undefined' && navigator.sendBeacon) {
      navigator.sendBeacon('/api/checklist', JSON.stringify(checklistData));
    }
  });

  // 页面从后台切回前台时自动同步 checklist（手机端特别有用）
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && currentIndex === -2) {
      loadChecklist();
    }
  });

  // 从服务器同步待办数据（支持跨设备）
  fetch('/api/todos')
    .then(function(r) { return r.json(); })
    .then(function(serverData) {
      var localData = getTodoData();
      var serverHasData = (serverData.fixed && serverData.fixed.length > 0) ||
        (serverData.monthly && Object.keys(serverData.monthly).length > 0);
      var localHasData = (localData.fixed && localData.fixed.length > 0) ||
        (localData.monthly && Object.keys(localData.monthly).length > 0);

      if (serverHasData) {
        // 服务器有数据，覆盖本地
        localStorage.setItem(LS_FIXED, JSON.stringify(serverData.fixed || []));
        localStorage.setItem(LS_MONTHLY, JSON.stringify(serverData.monthly || {}));
        renderTodos();
        renderCalendar();
      } else if (localHasData) {
        // 服务器为空但本地有数据，上传到服务器
        saveTodoData(localData);
      }
    })
    .catch(function() {});

  // 从 Supabase 同步待办数据（外网访问）
  if (SB_ENABLED) {
    sbLoad('todos').then(function(cloudData) {
      if (cloudData) {
        var localData = getTodoData();
        var cloudTime = cloudData.updatedAt || 0;
        var localTime = 0;
        try {
          var meta = JSON.parse(localStorage.getItem('workbench_todos_meta') || '{}');
          localTime = meta.updatedAt || 0;
        } catch(e) {}
        // 云端数据较新才覆盖
        if (cloudTime >= localTime) {
          localStorage.setItem(LS_FIXED, JSON.stringify(cloudData.fixed || []));
          localStorage.setItem(LS_MONTHLY, JSON.stringify(cloudData.monthly || {}));
          renderTodos();
          renderCalendar();
        } else if ((localData.fixed && localData.fixed.length > 0) ||
                   (localData.monthly && Object.keys(localData.monthly).length > 0)) {
          // 本地较新，上传到云端
          saveTodoData(localData);
        }
      } else {
        // 云端为空，上传本地数据
        var localData = getTodoData();
        if ((localData.fixed && localData.fixed.length > 0) ||
            (localData.monthly && Object.keys(localData.monthly).length > 0)) {
          saveTodoData(localData);
        }
      }
    }).catch(function() {});

    sbLoad('checklist').then(function(cloudData) {
      if (cloudData) {
        var localTime = 0;
        try {
          var cached = JSON.parse(localStorage.getItem(LS_CHECKLIST) || '{}');
          localTime = cached.updatedAt || 0;
        } catch(e) {}
        var cloudTime = cloudData.updatedAt || 0;
        if (cloudTime >= localTime) {
          checklistData.tax = cloudData.tax || checklistData.tax;
          checklistData.license = cloudData.license || checklistData.license;
          checklistData.updatedAt = cloudTime;
          localStorage.setItem(LS_CHECKLIST, JSON.stringify(checklistData));
          if (currentIndex === -2) renderChecklist();
        } else {
          saveChecklist();
        }
      } else {
        saveChecklist();
      }
    }).catch(function() {});
  }

  // 获取局域网 IP，方便手机访问
  fetch('/api/info')
    .then(function(r) { return r.json(); })
    .then(function(info) {
      if (info.lanIP) {
        var el = $('networkInfo');
        var ipEl = $('lanIp');
        if (el && ipEl) {
          ipEl.textContent = 'http://' + info.lanIP + ':' + info.port;
          el.style.display = 'block';
        }
      }
    })
    .catch(function() {});

  // 每分钟更新日期
  setInterval(updateHeaderDate, 60000);
})();
</script>

</body>
</html>
